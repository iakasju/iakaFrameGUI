[package]
name = "iakaframegui"
version = "0.1.0"
description = "iakaFrameGUI - la forge de la methode iakaframe (authoring de teams pures)"
authors = ["Stephane / iakateam"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` evite un conflit de nom lib/bin sur Windows
# (cf. https://github.com/rust-lang/cargo/issues/8519).
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Alignes sur les versions eprouvees du Cockpit (deja builde sur cet OS).
tauri = { version = "2.11.2", features = [] }
# Selecteur de dossier natif (P4) — meme montage que le Cockpit. Ne fournit qu'un
# chemin ; l'ecriture non destructive reste portee par kit_deploy (pathguard).
tauri-plugin-dialog = "2"
# DEROGATION ASSUMEE ET BORNEE a l'invariant AR-1/AR-6 (« backend sans sous-processus »).
# U1 de surface-apprentissage.md (Q-1) : pilote de `iakaframe review --json` (source unique du
# garde de consentement + plafonds). Ce plugin N'EXECUTE QUE ce que l'allow-list stricte de
# capabilities/default.json autorise (un binaire `iakaframe`/`node`, sous-commande `review`, argv
# fige). Ce n'est PAS un appel runner (LLM) : c'est l'outil frere deterministe d'iakaframe. Aucune
# logique de revue cote Rust. Cf. instruction § 4.2 / § 4.2bis.
tauri-plugin-shell = "2"
# Resolution du home cross-OS (chapeau + workspace), zero constante Windows.
dirs = "5"
# Lecture/ecriture du settings.json (override de la racine bibliotheque IAKAFRAME_HOME).
# Deja present dans l'arbre de deps via Tauri ; passe-plat de texte (Rust n'y met aucun schema metier).
serde_json = "1"
# Derive Serialize pour l'enum de chunks du streaming (StreamChunk → Channel Tauri v2 → union TS).
# Deja dans Cargo.lock (tire par Tauri) ; addition sans resolution reseau.
serde = { version = "1", features = ["derive"] }
# DEROGATION ASSUMEE ET BORNEE a l'invariant AR-1/AR-6 (copilote-inference-live.md, D1) : UN appel
# HTTP d'authoring (Ollama /api/chat) borne en provider (ollama), hote (loopback + endpoint regle)
# et temps (timeout). Authoring BUILD-TIME, JAMAIS un runner d'EXECUTION. HTTP seul (default-features
# off) — pas de pile TLS a compiler hors-ligne ; endpoint LAN attendu en http (Ollama). Cf. src/llm.rs.
# Feature `stream` : lecture INCREMENTALE de la reponse NDJSON d'Ollama (`stream:true`, /api/chat) pour
# le STREAMING d'authoring (llm_complete_stream). Additif ; toutes les deps transitives (tokio-util,
# futures-core, bytes) sont deja dans Cargo.lock (aucune resolution reseau). Cf. src/llm.rs.
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"] }
# Consommation du `bytes_stream()` de reqwest (StreamExt::next) pour la lecture NDJSON ligne par ligne.
# Deja present dans Cargo.lock (tire par tokio/tauri) — addition sans resolution reseau.
futures-util = "0.3"
